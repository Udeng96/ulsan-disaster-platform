plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.eseict.ulsan'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // SNMP v3 조회 (방화벽 → 앞으로 스위치·서버도 같은 클라이언트)
    implementation 'org.snmp4j:snmp4j:3.8.2'

    // 서버 13대 중 리눅스 SSH 읽기 전용 수집 (admin-ro 키 로그인)
    implementation 'org.apache.sshd:sshd-core:2.14.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // executable WAR (java -jar server.war) / 외부 톰캣 둘 다 — 형제 모듈과 동일
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 운영 WAR에는 개발 DB 접속정보를 넣지 않는다. deploy 외부 설정이 필수다.
tasks.named('bootWar') {
    rootSpec.exclude('**/application.yml')
}
